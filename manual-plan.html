<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <header class="app-header">


    <nav class="top-nav">

      <a href="index.html" class="nav-link">
        Delivery Record
      </a>

      <a href="records.html" class="nav-link">
        Output Record
      </a>

      <a href="manual-plan.html" class="nav-link active">
        Welding Prod Record
      </a>

    </nav>

  </header>
  <link rel="stylesheet" href="header.css">
  
  <link rel="stylesheet" href="manual-plan.css">

  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
</head>

<body>

  <div class="container">

    <div class="top-bar">
      <h1>Welding Production Delivery Record</h1>

      <div class="actions">
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <button id="copyBtn">Copy Planning</button>
        <button id="exportBtn">
          Export Excel
        </button>
      </div>
    </div>

    <div class="main-layout">

      <!-- LEFT -->
      <div class="left-panel">


        <!-- FILTER -->
        <div class="filter-box">

          <div class="filter-group">

            <label>Invoice:</label>

            <select id="filterInvoice">
              <option value="">All Invoices</option>
            </select>

          </div>

          <div class="filter-group">

            <label>Item:</label>

            <select id="filterItem">
              <option value="">All Items</option>
            </select>

          </div>

          <div class="filter-group">

            <label>Operator:</label>

            <select id="filterOperator">
              <option value="">All Operators</option>
            </select>

          </div>

          <div class="filter-group">

            <label>Year:</label>

            <select id="filterYear">
              <option value="">All Years</option>
            </select>

            <label>Month:</label>

            <select id="filterMonth">
              <option value="">All Months</option>
            </select>

            <label>Date:</label>

            <select id="filterDate">
              <option value="">All Dates</option>
            </select>

          </div>

        </div>


        <div class="table-wrapper">
          <table id="dataTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="right-panel">

        <h2>Planning Matrix</h2>

        <div class="planning-wrapper">
          <table id="planningTable"></table>
        </div>

      </div>

    </div>

  </div>

  <script src="manual-plan.js"></script>
</body>

</html>
