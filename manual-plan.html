<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welding Production Delivery Record</title>

  <link rel="stylesheet" href="manual-plan.css">

  <!-- SheetJS -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
</head>

<body>

  <div class="container">

    <div class="top-bar">
      <h1>Welding Production Delivery Record</h1>

      <div class="actions">
        <input type="file" id="excelFile" accept=".xlsx, .xls">
        <button id="copyBtn">Copy Planning</button>
        <button id="exportBtn">
          Export Excel
        </button>
      </div>
    </div>

    <div class="main-layout">

      <!-- LEFT -->
      <div class="left-panel">

        <h2>Excel Data</h2>
        <button class="back-btn" onclick="goBackPlanning()">
          ← Back To Planning
        </button>

        <!-- FILTER -->
        <div class="filter-box">

          <div class="filter-group">

            <label>Invoice:</label>

            <select id="filterInvoice">
              <option value="">All</option>
            </select>

          </div>

          <div class="filter-group">

            <label>Item:</label>

            <select id="filterItem">
              <option value="">All</option>
            </select>

          </div>

          <div class="filter-group">

            <label>Operator:</label>

            <select id="filterOperator">
              <option value="">All</option>
            </select>

          </div>

          <div class="filter-group">

            <label>Date:</label>

            <select id="filterDate">
              <option value="">All</option>
            </select>

          </div>

        </div>


        <div class="table-wrapper">
          <table id="dataTable">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>

      </div>

      <!-- RIGHT -->
      <div class="right-panel">

        <h2>Planning Matrix</h2>

        <div class="planning-wrapper">
          <table id="planningTable"></table>
        </div>

      </div>

    </div>

  </div>

  <script src="manual-plan.js"></script>
</body>

</html>
