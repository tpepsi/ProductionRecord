<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Planning Copy Panel</title>
  <link rel="stylesheet" href="planning.css"/>
</head>
<body>

<div class="container">

  <h1>Planning Copy Panel</h1>

  <div class="top-buttons">
    <button onclick="goBack()">← Back</button>
    <button onclick="generatePlanning()">Generate Planning Data</button>
    <button onclick="copyPlanning()">Copy for Excel</button>
  </div>

  <div class="layout">

    <!-- LEFT -->
    <div class="left-panel">
      <h2>Production Records</h2>

      <table id="recordTable">
        <thead>
          <tr>
            <th>Invoice</th>
            <th>Item</th>
            <th>Operator</th>
            <th>Date</th>
            <th>Qty</th>
            <th>Combine</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">
      <h2>Excel Planning Output</h2>

      <table id="planningTable">
        <tbody></tbody>
      </table>
    </div>

  </div>
</div>

<script src="planning.js"></script>

</body>
</html>
